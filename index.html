<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="アーカイブサイト">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f2ec;
      --surface: #fbfaf6;
      --text: #1f211f;
      --muted: #666a64;
      --line: #c9c9c1;
      --content-width: 1440px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .site-header,
    main,
    .site-footer {
      width: min(calc(100% - 64px), var(--content-width));
      margin-inline: auto;
    }

    .site-header {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.5fr);
      gap: 48px;
      align-items: end;
      padding: 64px 0 38px;
      border-bottom: 1px solid var(--line);
    }

    .site-title {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      font-size: clamp(2.75rem, 7vw, 6.75rem);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .question {
      margin: 0;
      padding-top: 14px;
      border-top: 1px solid var(--text);
    }

    .question-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    .question-text {
      display: block;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.6;
    }

    main {
      padding: 36px 0 88px;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 52px 24px;
      align-items: start;
    }

    .archive-item {
      min-width: 0;
      margin: 0;
    }

    .archive-item:first-child {
      grid-row: span 2;
    }

    .image-frame {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #e8e6df;
      border: 1px solid var(--line);
    }

    .archive-item:first-child .image-frame {
      aspect-ratio: 3 / 4;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 320ms ease;
    }

    .image-frame img.is-loaded {
      opacity: 1;
    }

    .item-caption {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: baseline;
      padding: 14px 2px 0;
      border-top: 1px solid transparent;
    }

    .item-number {
      color: var(--muted);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
    }

    .item-name {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      font-weight: 500;
      line-height: 1.5;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 0 28px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    @media (max-width: 760px) {
      .site-header,
      main,
      .site-footer {
        width: min(calc(100% - 32px), var(--content-width));
      }

      .site-header {
        grid-template-columns: 1fr;
        gap: 36px;
        padding: 38px 0 26px;
      }

      .site-title {
        font-size: clamp(2.7rem, 15vw, 4.6rem);
      }

      main {
        padding: 24px 0 56px;
      }

      .archive-grid {
        grid-template-columns: 1fr;
        gap: 38px;
      }

      .archive-item:first-child {
        grid-row: auto;
      }

      .image-frame,
      .archive-item:first-child .image-frame {
        aspect-ratio: auto;
        min-height: 0;
      }

      .image-frame img {
        width: 100%;
        height: auto;
        object-fit: initial;
      }

      .site-footer {
        padding-bottom: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .image-frame img {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">アーカイブサイト</h1>
    <p class="question">
      <span class="question-label">いま気になっていること</span>
      <span class="question-text">(ここに言葉)</span>
    </p>
  </header>

  <main>
    <section class="archive-grid" id="archive-grid" aria-label="アーカイブ一覧"></section>
  </main>

  <footer class="site-footer">
    <span>ARCHIVE</span>
    <span id="item-count"></span>
  </footer>

  <script>
    const archiveItems = [
      { image: "images/01.jpg", name: "(ここに言葉)" },
      { image: "images/02.jpg", name: "(ここに言葉)" },
      { image: "images/03.jpg", name: "(ここに言葉)" },
      { image: "images/04.jpg", name: "(ここに言葉)" },
      { image: "images/05.jpg", name: "(ここに言葉)" }
    ];

    const grid = document.querySelector("#archive-grid");
    const count = document.querySelector("#item-count");

    archiveItems.forEach((item, index) => {
      const figure = document.createElement("figure");
      figure.className = "archive-item";

      const frame = document.createElement("div");
      frame.className = "image-frame";

      const image = document.createElement("img");
      image.src = item.image;
      image.alt = item.name;
      image.decoding = "async";
      image.loading = index < 2 ? "eager" : "lazy";
      image.addEventListener("load", () => image.classList.add("is-loaded"));
      if (image.complete) image.classList.add("is-loaded");

      const caption = document.createElement("figcaption");
      caption.className = "item-caption";

      const number = document.createElement("span");
      number.className = "item-number";
      number.textContent = String(index + 1).padStart(2, "0");

      const name = document.createElement("h2");
      name.className = "item-name";
      name.textContent = item.name;

      frame.append(image);
      caption.append(number, name);
      figure.append(frame, caption);
      grid.append(figure);
    });

    count.textContent = `${String(archiveItems.length).padStart(2, "0")} ITEMS`;
  </script>
</body>
</html>
